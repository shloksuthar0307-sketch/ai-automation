{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="cult">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Login – Sitewright</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'core/css/style.css' %}">

<style nonce="{{ request.csp_nonce }}">
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
}

.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 44px 36px;
  box-shadow: var(--shadow-elevated);
  position: relative;
  overflow: hidden;
}

.login-card::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: 24px;
  padding: 1px;
  background: conic-gradient(from 0deg, transparent 0deg, rgba(255, 255, 255, 0.6) 60deg, transparent 120deg);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  animation: borderBeamRotate 6s linear infinite;
}

.login-header {
  text-align: center;
  margin-bottom: 32px;
}
.login-logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 24px;
  color: var(--ink-heading);
  margin-bottom: 8px;
}
.login-header p {
  color: var(--muted);
  font-size: 14px;
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.login-error {
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #f87171;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13.5px;
  text-align: center;
}

.login-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: #ffffff;
  color: #09090b;
  font-weight: 600;
  font-size: 15px;
  border: 0;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
}
.login-btn:hover {
  background: #e4e4e7;
  transform: translateY(-1px);
}

.login-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 13.5px;
  color: var(--muted);
}
.login-footer a:hover {
  color: #ffffff;
}
</style>
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <span class="logo-gem"></span>
        Sitewright
      </div>
      <p>Enter your staff credentials to access the admin portal</p>
    </div>

    {% if error_message %}
    <div class="login-error" style="margin-bottom: 18px;">
      {{ error_message }}
    </div>
    {% endif %}

    <form class="login-form" method="post" action="{% url 'core:admin_login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="form-field">
        <label for="username" style="font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px;">Username</label>
        <input type="text" id="username" name="username" class="cult-input form-control" required placeholder="admin" autofocus>
      </div>

      <div class="form-field">
        <label for="password" style="font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px;">Password</label>
        <input type="password" id="password" name="password" class="cult-input form-control" required placeholder="••••••••••••">
      </div>

      <button type="submit" class="login-btn" style="margin-top: 8px;">
        Sign in to Dashboard →
      </button>
    </form>

    <div class="login-footer">
      <a href="{% url 'core:index' %}">← Return to live website</a>
    </div>
  </div>
</div>

</body>
</html>
